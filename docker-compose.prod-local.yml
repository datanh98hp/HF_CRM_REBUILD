services:
  caddy:
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    environment:
      WEB_DOMAIN: localhost
      API_DOMAIN: localhost
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    ports: !reset []
  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
    ports: !reset []
  toolbox:
    env_file:
      - .env.prod.local

volumes:
  postgres_data:
    name: hf_crm_prod_local_postgres_data
  redis_data:
    name: hf_crm_prod_local_redis_data
  toolbox_node_modules:
    name: hf_crm_prod_local_toolbox_node_modules
