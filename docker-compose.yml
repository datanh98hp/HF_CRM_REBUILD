services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:1.4}
    networks:
      - import_scanner
    volumes:
      - clamav_database:/var/lib/clamav
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "db:migrate:deploy", "--workspace", "@finance-crm/api"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "db:seed", "--workspace", "@finance-crm/api"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET in .env}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      WEB_ORIGINS: "${WEB_ORIGINS:-http://localhost:3000,http://127.0.0.1:300}"
      CONTRACT_DOCUMENT_DIRECTORY: ${CONTRACT_DOCUMENT_DIRECTORY:-/app/contracts}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PREFIX: ${MINIO_PREFIX:-contracts}
      CUSTOMER_IMPORT_TEMP_DIR: /app/apps/api/import-customer-files
      CUSTOMER_IMPORT_SCANNER_HOST: clamav
      CUSTOMER_IMPORT_SCANNER_PORT: "3310"
      CUSTOMER_IMPORT_SCANNER_TIMEOUT_MS: ${CUSTOMER_IMPORT_SCANNER_TIMEOUT_MS:-120000}
    networks:
      - default
      - import_scanner
    volumes:
      - ${CONTRACT_DOCUMENT_HOST:-./apps/api/src/Assets/contracts}:/app/contracts
      - customer_import_files:/app/apps/api/import-customer-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "apps/api/dist/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET in .env}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      CUSTOMER_IMPORT_TEMP_DIR: /app/apps/api/import-customer-files
      CUSTOMER_IMPORT_SCANNER_HOST: clamav
      CUSTOMER_IMPORT_SCANNER_PORT: "3310"
      CUSTOMER_IMPORT_SCANNER_TIMEOUT_MS: ${CUSTOMER_IMPORT_SCANNER_TIMEOUT_MS:-120000}
    networks:
      - default
      - import_scanner
    volumes:
      - customer_import_files:/app/apps/api/import-customer-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  toolbox:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.tools
    working_dir: /workspace
    volumes:
      - .:/workspace
      - toolbox_node_modules:/workspace/node_modules
    environment:
      DATABASE_URL: ${TOOLBOX_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
    init: true

volumes:
  postgres_data:
  redis_data:
  clamav_database:
  customer_import_files:
  toolbox_node_modules:

networks:
  import_scanner:
    driver: bridge
